server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and uploads to the backend container on the local Docker network
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        # nginx defaults to a 1MB client_max_body_size, which was silently
        # rejecting any material upload (PDF/video/audio) bigger than that
        # with a 413 before the request ever reached the backend/multer
        # limits below. Raised to cover the largest per-type ceiling
        # (video, 500MB by default) so nginx is never the bottleneck.
        client_max_body_size 500M;
        # AI generation endpoints (assignment/quiz generation, Nirantar AI)
        # can legitimately run close to the backend's own 120-180s AI
        # timeout on slower/CPU-only Ollama setups — nginx's 60s default
        # read timeout was cutting those off with a bare 504 before the
        # backend's own timeout/error handling ever got a chance to run.
        proxy_connect_timeout 185s;
        proxy_send_timeout 185s;
        proxy_read_timeout 185s;
    }

    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }
}